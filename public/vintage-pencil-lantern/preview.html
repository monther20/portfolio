<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vintage pencil lantern — 3D inspection</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#282825;font:14px system-ui, sans-serif;overflow:hidden}canvas{display:block;width:100%;height:100%}
header{position:fixed;left:32px;top:25px;pointer-events:none}header small{font-size:10px;letter-spacing:2.8px;text-transform:uppercase;color:#77776b}h1{font:normal 28px Georgia,serif;margin:10px 0}header p{font-size:12px;color:#6c6c61;margin:0}
.panel{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:8px;background:#fffef9eb;border:1px solid #cecec2;border-radius:12px;box-shadow:0 4px 16px #2221;white-space:nowrap}
button{background:#eeede5;border:1px solid #d4d3c8;padding:10px 16px;border-radius:7px;font:inherit;cursor:pointer;color:#36362f}button:hover{background:#deddd2}button.active{background:#31332e;color:#fff;border-color:#31332e}
#stats{position:fixed;bottom:27px;left:28px;font-size:11px;line-height:1.7;color:#65665c}#hint{position:fixed;right:28px;bottom:31px;font-size:11px;color:#65665c}#status{position:fixed;right:28px;top:30px;font-size:11px;letter-spacing:1.6px;color:#6c6c60}
@media(max-width:760px){header{left:18px;top:17px}h1{font-size:23px}#stats,#hint{display:none}.panel{bottom:15px;gap:4px}button{padding:9px 11px;font-size:12px}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body>
<header><small>Illustrated objects / 01</small><h1>Vintage wall lantern</h1><p>Graphite contours · octagonal construction</p></header>
<div id="status">LOADING</div><div id="stats"></div><div id="hint">Drag to orbit · Scroll to zoom</div>
<div class="panel"><button id="light" aria-pressed="false">Light off</button><button id="front">Front</button><button id="side">Side</button><button id="three">3D view</button><button id="wire" aria-pressed="false">Wireframe</button></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from './vendor/meshoptimizer/meshopt_decoder.module.js';
import { createLanternControls } from './lantern-controls.js';

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(0xf5f4ee);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-.75,.75,.68,-.68,.01,20);
camera.position.set(1.4,1.03,2.4);
const controls = new OrbitControls(camera,renderer.domElement);
controls.target.set(0,.527,-.045);controls.enableDamping=true;controls.minZoom=.65;controls.maxZoom=4;
scene.add(new THREE.HemisphereLight(0xffffff,0x999999,1.6));
let root, lightControls, wire = false;
const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
const compact = new URLSearchParams(location.search).has('meshopt');
const gltf = await loader.loadAsync(compact ? './vintage-pencil-lantern.meshopt.glb' : './vintage-pencil-lantern.glb');
root=gltf.scene;scene.add(root);lightControls=createLanternControls(root);
root.traverse(o=>{if(o.isMesh&&o.material.map)o.material.map.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());});
const stats=await fetch('./model-statistics.json').then(r=>r.json());
document.querySelector('#stats').innerHTML=`${stats.triangles.toLocaleString()} triangles · ${stats.vertices.toLocaleString()} vertices<br>${stats.materials} materials · 1024² pencil atlas`;
function setLight(on){lightControls.setLight(on);document.querySelector('#light').textContent=on?'Light on':'Light off';document.querySelector('#light').classList.toggle('active',on);document.querySelector('#light').setAttribute('aria-pressed',on);document.querySelector('#status').textContent=on?'WARM LIGHT / ON':'PENCIL / LIGHT OFF';}
document.querySelector('#light').onclick=()=>setLight(!lightControls.isOn);
const views={front:[0,.527,3],side:[3,.527,-.045],three:[1.4,1.03,2.4],back:[0,.527,-3],top:[0,3,-.001],bottom:[0,-2,-.001]};
function setView(name){camera.position.set(...views[name]);controls.target.set(0,.527,-.045);camera.up.set(0,1,0);controls.update();}
for(const name of ['front','side','three'])document.querySelector('#'+name).onclick=()=>setView(name);
document.querySelector('#wire').onclick=()=>{wire=!wire;root.traverse(o=>{if(o.isMesh)o.material.wireframe=wire});document.querySelector('#wire').classList.toggle('active',wire);document.querySelector('#wire').setAttribute('aria-pressed',wire)};
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);const aspect=w/h;const hh=.63;camera.left=-hh*aspect;camera.right=hh*aspect;camera.top=hh;camera.bottom=-hh;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();setLight(false);
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
window.lantern={root,renderer,camera,controls,lightControls,setLight,setView,stats};
window.lanternReady=true;
</script>
</body></html>
